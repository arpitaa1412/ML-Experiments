<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KNN Diabetes Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1f4e79;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input::placeholder {
            color: #999;
        }

        input:focus {
            outline: none;
            border-color: #1f4e79;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 13px 35px;
            border: none;
            border-radius: 8px;
            background: #1f4e79;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            background: #eaf2f8;
            color: #1f4e79;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>KNN Diabetes Prediction</h1>

    <p class="subtitle">
        Enter the patient's medical information to get a prediction.
    </p>

    <form action="/predict" method="POST">

        <div class="form-grid">

            <!-- Pregnancies -->
            <div class="form-group">
                <label for="Pregnancies">Pregnancies</label>
                <input
                    type="number"
                    id="Pregnancies"
                    name="Pregnancies"
                    placeholder="Example: 2"
                    min="0"
                    required
                >
            </div>

            <!-- Glucose -->
            <div class="form-group">
                <label for="Glucose">Glucose</label>
                <input
                    type="number"
                    id="Glucose"
                    name="Glucose"
                    placeholder="Example: 120"
                    min="0"
                    required
                >
            </div>

            <!-- Blood Pressure -->
            <div class="form-group">
                <label for="BloodPressure">Blood Pressure</label>
                <input
                    type="number"
                    id="BloodPressure"
                    name="BloodPressure"
                    placeholder="Example: 70"
                    min="0"
                    required
                >
            </div>

            <!-- Skin Thickness -->
            <div class="form-group">
                <label for="SkinThickness">Skin Thickness</label>
                <input
                    type="number"
                    id="SkinThickness"
                    name="SkinThickness"
                    placeholder="Example: 20"
                    min="0"
                    required
                >
            </div>

            <!-- Insulin -->
            <div class="form-group">
                <label for="Insulin">Insulin</label>
                <input
                    type="number"
                    id="Insulin"
                    name="Insulin"
                    placeholder="Example: 80"
                    min="0"
                    required
                >
            </div>

            <!-- BMI -->
            <div class="form-group">
                <label for="BMI">BMI</label>
                <input
                    type="number"
                    step="0.01"
                    id="BMI"
                    name="BMI"
                    placeholder="Example: 25.5"
                    min="0"
                    required
                >
            </div>

            <!-- Diabetes Pedigree Function -->
            <div class="form-group">
                <label for="DiabetesPedigreeFunction">
                    Diabetes Pedigree Function
                </label>

                <input
                    type="number"
                    step="0.001"
                    id="DiabetesPedigreeFunction"
                    name="DiabetesPedigreeFunction"
                    placeholder="Example: 0.350"
                    min="0"
                    required
                >
            </div>

            <!-- Age -->
            <div class="form-group">
                <label for="Age">Age</label>
                <input
                    type="number"
                    id="Age"
                    name="Age"
                    placeholder="Example: 30"
                    min="1"
                    required
                >
            </div>

        </div>

        <div class="button-container">
            <button type="submit">
                Predict Diabetes
            </button>
        </div>

    </form>

    {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
    {% endif %}

</div>

</body>
</html>
