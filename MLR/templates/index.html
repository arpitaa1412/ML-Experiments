<!DOCTYPE html>
<html>
<head>

    <title>Medical Insurance Cost Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            text-align: center;
            font-size: 24px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Medical Insurance Cost Prediction</h1>

    <form action="/predict" method="POST">

        <label>Age:</label>
        <input type="number" name="age" required>

        <label>BMI:</label>
        <input type="number" step="0.1" name="bmi" required>

        <label>Number of Children:</label>
        <input type="number" name="children" required>

        <label>Sex:</label>
        <select name="sex" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label>Smoker:</label>
        <select name="smoker" required>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>

        <label>Region:</label>
        <select name="region" required>
            <option value="northeast">Northeast</option>
            <option value="northwest">Northwest</option>
            <option value="southeast">Southeast</option>
            <option value="southwest">Southwest</option>
        </select>

        <button type="submit">
            Predict Insurance Cost
        </button>

    </form>

    {% if prediction %}
        <div class="result">
            Predicted Insurance Cost: ${{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
